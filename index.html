<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 16px;
            color: #2563eb;
        }

        p {
            margin-bottom: 24px;
            line-height: 1.5;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hallo GitHub Pages 👋</h1>
        <p>
            Diese Website wird kostenlos über GitHub Pages gehostet.
        </p>

        <button onclick="sayHello()">
            Klick mich
        </button>
    </div>
    <iframe width="768" height="496" src="https://miro.com/app/live-embed/uXjVH1nQgOg=/?focusWidget=3458764679735317889&embedMode=view_only_without_ui&embedId=749557263411" frameborder="0" scrolling="no" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>

    <script>
        function sayHello() {
            alert("✅ JavaScript funktioniert!");
        }
    </script>

</body>
</html>
